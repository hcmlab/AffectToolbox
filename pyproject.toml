[project]
name = "affect-toolbox"
version = "0.1.0"
description = "Multimodal realtime affect analysis"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ai-edge-litert",
    "audonnx",
    # faster-whisper 1.2 uses PyAV's metadata_errors argument, removed in PyAV 19.
    "av>=11,<19",
    "faster-whisper",
    "germansentiment",
    "kafka-python",
    "lxml",
    "mediapipe",
    "numpy",
    "onnxruntime",
    "opencv-contrib-python",
    "PyAudio",
    "pygrabber",
    "pyqtgraph",
    "PySide6",
    "scipy",
    "silero-vad",
    "torch",
    "transformers",
    "sentencepiece",
    "termcolor",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
